# CardioLink Admin - configuracion de Supabase CLI.
#
# patient-reminders-24h no usa el JWT de Supabase para autenticarse (la
# invoca un cron job server-side, no un usuario logueado) - usa un secret
# propio (PATIENT_REMINDERS_CRON_SECRET), verificado dentro de la propia
# funcion, fail-closed si falta o no coincide. Por default Supabase exige
# un JWT valido (anon/authenticated/service_role) en el gateway ANTES de
# que el codigo de la funcion corra; sin este "verify_jwt = false"
# puntual, el cron job (que manda el secret propio en el header
# Authorization, no un JWT) quedaria rechazado por el gateway antes de
# llegar a la verificacion real. Esto NO deja la funcion abierta: sigue
# exigiendo el secret propio como unica puerta de entrada.
#
# patient-communications tambien corre con verify_jwt = false: la
# verificacion real queda enteramente del lado de la funcion misma
# (autorizar() valida el JWT del llamador con auth.getUser() y exige
# ademas que pase cardiolink_has_communications_access() via RPC) en vez
# de la capa de plataforma. Alineado con lo que ya esta funcionando en
# Production.

[functions.patient-reminders-24h]
verify_jwt = false

[functions.patient-communications]
verify_jwt = false
